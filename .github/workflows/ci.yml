name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Reject local runtime data and populated secrets
        run: node scripts/validate-repository-hygiene.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTNAME: ai-jobpilot-cloud-ci
      APP_AUTO_OPEN_BROWSER: "false"
      APP_BROWSER_HEADLESS: "true"
      APP_CACHE_DIR: /tmp/ai-jobpilot-cloud-ci/cache
      APP_DATA_DIR: /tmp/ai-jobpilot-cloud-ci/data
      APP_OUTPUT_DIR: /tmp/ai-jobpilot-cloud-ci/output
      LOGGING_FILE_NAME: /tmp/ai-jobpilot-cloud-ci/logs/get-jobs.log
      SPRING_DATASOURCE_URL: jdbc:sqlite:/tmp/ai-jobpilot-cloud-ci/getjobs-ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare CI directories and Gradle wrapper
        run: |
          mkdir -p "$APP_CACHE_DIR" "$APP_DATA_DIR" "$APP_OUTPUT_DIR" "$(dirname "$LOGGING_FILE_NAME")"
          chmod +x ./gradlew

      - name: Run backend tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Print failed JUnit reports
        if: failure()
        shell: bash
        run: |
          found_failure=false
          for report in build/test-results/test/*.xml; do
            if grep -Eq 'failures="[1-9]|errors="[1-9]' "$report"; then
              found_failure=true
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done
          if [[ "$found_failure" == "false" ]]; then
            echo "No failed JUnit XML report was found."
          fi

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Build backend
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        working-directory: front
        run: pnpm lint

      - name: Run frontend tests
        working-directory: front
        run: pnpm test

      - name: Build frontend
        working-directory: front
        run: pnpm build

  chrome-extension:
    name: Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate manifest and referenced files
        run: node scripts/validate-chrome-extension.mjs

  docker-config:
    name: Docker Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: |
          mkdir -p .secrets
          printf 'ci-owner-password' > .secrets/db_owner_password
          printf 'ci-app-password' > .secrets/db_app_password
          printf 'ci-redis-password' > .secrets/redis_password
          printf 'ci-auth-hash-pepper-at-least-32-bytes' > .secrets/auth_hash_pepper
          openssl rand -hex 32 > .secrets/data_encryption_key
          : > .secrets/ai_api_key
          docker compose config --quiet

      - name: Verify required Dockerfile stages
        shell: bash
        run: |
          for stage in backend-dev frontend-dev frontend-build web-runtime backend-build runtime; do
            grep -Eq "^[[:space:]]*FROM[[:space:]].*[[:space:]]AS[[:space:]]${stage}([[:space:]]|$)" Dockerfile || {
              echo "Missing Dockerfile stage: ${stage}"
              exit 1
            }
          done

      - name: Validate Nginx configuration
        shell: bash
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -e NGINX_SERVER_NAME=localhost \
            -e NGINX_CLIENT_MAX_BODY_SIZE=30m \
            -e NGINX_PROXY_READ_TIMEOUT=60s \
            -e NGINX_AUTH_RATE=10r/m \
            -e NGINX_PLUGIN_RATE=120r/m \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            nginx:stable-alpine nginx -t
          mkdir -p /tmp/ai-jobpilot-nginx-tls
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /tmp/ai-jobpilot-nginx-tls/privkey.pem \
            -out /tmp/ai-jobpilot-nginx-tls/fullchain.pem \
            -days 1 -subj '/CN=app.example.com'
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -v "$PWD/deploy/nginx/https.conf.example:/etc/nginx/conf.d/default.conf:ro" \
            -v "/tmp/ai-jobpilot-nginx-tls:/etc/letsencrypt/live/app.example.com:ro" \
            nginx:stable-alpine nginx -t

  cloud-compose:
    name: Cloud Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create ephemeral CI secrets
        run: |
          mkdir -p .secrets
          printf 'ci-owner-password' > .secrets/db_owner_password
          printf 'ci-app-password' > .secrets/db_app_password
          printf 'ci-redis-password' > .secrets/redis_password
          printf 'ci-auth-hash-pepper-at-least-32-bytes' > .secrets/auth_hash_pepper
          openssl rand -hex 32 > .secrets/data_encryption_key
          : > .secrets/ai_api_key

      - name: Build and start Cloud stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Verify the only public entry and health
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/health | grep -q '"status":"UP"'
          curl --fail --silent http://127.0.0.1:8080/livez | grep -q '"status":"UP"'
          docker compose ps --format json > /tmp/cloud-compose-ps.json
          published_services="$(jq -r 'select(any(.Publishers[]?; .PublishedPort > 0)) | .Service' /tmp/cloud-compose-ps.json)"
          test "$published_services" = "nginx"
          test "$(docker compose port nginx 8080)" = "127.0.0.1:8080"

      - name: Verify registration, session, CSRF and logout
        shell: bash
        run: |
          base_url='http://127.0.0.1:8080'
          cookie_jar='/tmp/ai-jobpilot-auth.cookies'
          csrf_token="$(curl --fail --silent --cookie-jar "$cookie_jar" "$base_url/api/auth/csrf" | jq -r '.data.csrfToken')"
          register_response="$(curl --fail --silent \
            --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $csrf_token" \
            --data '{"email":"ci-auth@example.invalid","password":"CiSmokePassword!2026","acceptTerms":true}' \
            "$base_url/api/auth/register")"
          authenticated_csrf="$(jq -r '.data.csrfToken' <<< "$register_response")"
          test "$(jq -r '.success' <<< "$register_response")" = 'true'
          curl --fail --silent --cookie "$cookie_jar" \
            -H "X-CSRF-TOKEN: $authenticated_csrf" -X POST --data '' "$base_url/api/me" \
            | grep -q 'ci\*\*\*@example.invalid'
          curl --fail --silent --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            -H "X-CSRF-TOKEN: $authenticated_csrf" -X POST "$base_url/api/auth/logout" \
            | grep -q '"loggedOut":true'
          anonymous_csrf="$(curl --fail --silent \
            --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
            "$base_url/api/auth/csrf" | jq -r '.data.csrfToken')"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$cookie_jar" -H "X-CSRF-TOKEN: $anonymous_csrf" \
            -X POST --data '' "$base_url/api/me")" = '401'

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop disposable CI stack
        if: always()
        run: docker compose down -v --remove-orphans
