name: ai-jobpilot-cloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_jobpilot}
      POSTGRES_USER: ${DB_MIGRATION_USERNAME:-jobpilot_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_owner_password
      - db_app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/start-redis.sh"]
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
      - ./docker/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  clamav:
    image: clamav/clamav:1.5.3-debian
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-jobpilot-cloud-app:${APP_IMAGE_TAG:-local}
    pull_policy: never
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: cloud,migrate
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_jobpilot}?connectTimeout=3&socketTimeout=3&tcpKeepAlive=true
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-jobpilot_owner}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_owner_password
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-jobpilot-cloud-app:${APP_IMAGE_TAG:-local}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: cloud,api,prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_jobpilot}?connectTimeout=3&socketTimeout=3&tcpKeepAlive=true
      REDIS_HOST: redis
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_TERMS_VERSION: ${AUTH_TERMS_VERSION:-2026-08-draft}
      # 插件绑定与投递执行的运行参数（非敏感），默认值与 application-api.yaml 一致；
      # Token、绑定码与固定秘密绝不通过环境变量注入。
      PLUGIN_BIND_CODE_TTL: ${PLUGIN_BIND_CODE_TTL:-5m}
      PLUGIN_MAX_ACTIVE_BIND_CODES: ${PLUGIN_MAX_ACTIVE_BIND_CODES:-3}
      PLUGIN_TOKEN_TTL: ${PLUGIN_TOKEN_TTL:-90d}
      PLUGIN_MAX_DEVICES_PER_USER: ${PLUGIN_MAX_DEVICES_PER_USER:-10}
      PLUGIN_MIN_EXTENSION_VERSION: ${PLUGIN_MIN_EXTENSION_VERSION:-}
      # 公开的扩展 Origin 白名单（非秘密）；只含精确 chrome-extension://<id>。
      PLUGIN_ALLOWED_EXTENSION_ORIGINS: ${PLUGIN_ALLOWED_EXTENSION_ORIGINS:-chrome-extension://ompipmnadogogfbebnmjgbbcadildpbc}
      DELIVERY_LEASE_SECONDS: ${DELIVERY_LEASE_SECONDS:-600}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_LOCAL_ROOT: /var/lib/ai-jobpilot/private
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      APP_DATA_ENCRYPTION_KEY_ID: ${APP_DATA_ENCRYPTION_KEY_ID:-v1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_app_password
      - redis_password
      - auth_hash_pepper
      - data_encryption_key
    volumes:
      - private-storage:/var/lib/ai-jobpilot/private
    networks:
      - edge
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/health-probe.jar", "http://127.0.0.1:8888/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ai-jobpilot-cloud-app:${APP_IMAGE_TAG:-local}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: cloud,worker,prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_jobpilot}?connectTimeout=3&socketTimeout=3&tcpKeepAlive=true
      REDIS_HOST: redis
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_LOCAL_ROOT: /var/lib/ai-jobpilot/private
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      APP_DATA_ENCRYPTION_KEY_ID: ${APP_DATA_ENCRYPTION_KEY_ID:-v1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_app_password
      - redis_password
      - data_encryption_key
      - ai_api_key
    volumes:
      - private-storage:/var/lib/ai-jobpilot/private
    networks:
      - data
      - worker-egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/health-probe.jar", "http://127.0.0.1:8889/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    image: ai-jobpilot-cloud-web:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PORT: 6866
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6866/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=4m
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:8080"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-11m}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-60s}
      NGINX_AUTH_RATE: ${NGINX_AUTH_RATE:-10r/m}
      NGINX_PLUGIN_RATE: ${NGINX_PLUGIN_RATE:-120r/m}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

secrets:
  db_owner_password:
    file: ./.secrets/db_owner_password
  db_app_password:
    file: ./.secrets/db_app_password
  redis_password:
    file: ./.secrets/redis_password
  auth_hash_pepper:
    file: ./.secrets/auth_hash_pepper
  data_encryption_key:
    file: ./.secrets/data_encryption_key
  ai_api_key:
    file: ./.secrets/ai_api_key

volumes:
  postgres-data:
  redis-data:
  private-storage:
  clamav-db:

networks:
  edge:
  data:
    internal: true
  worker-egress:
